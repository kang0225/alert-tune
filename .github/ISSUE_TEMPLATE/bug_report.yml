name: Bug report
description: Report a reproducible problem with alert-tune.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a new bug.
        For security vulnerabilities, follow the [security policy](https://github.com/kang0225/alert-tune/blob/main/SECURITY.md) instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Paste the output of alert-tune version (or ./bin/alert-tune version for a local build), or provide the commit SHA.
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and CPU architecture. Include your Go version if you built from source.
      placeholder: "OS: macOS / Linux / Windows\nArchitecture: arm64 / amd64\nGo version, if applicable:"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the exact commands and a minimal example needed to reproduce the problem. Remove credentials and sensitive data.
      placeholder: "1. Run ...\n2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened instead, including any error message.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Optional. Remove tokens, passwords, and sensitive production data before sharing.
      render: shell
    validations:
      required: false
